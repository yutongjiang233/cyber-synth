<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Advanced Ritual UI</title>
    <style>
        /* ===========================================
           1. CSS 全局变量 (色彩、玻璃质感与动画)
           =========================================== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 0.8s;
            
            --neon-cyan: #00ffff;
            --neon-purple: #ff00ff;
            
            /* 🔴 高透玻璃质感核心变量 */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%); 
            --glass-border: rgba(0, 255, 255, 0.25);
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            
            /* Envelope 轨道专有颜色 */
            --track-dark: rgba(15, 20, 35, 0.6);
        }

        /* ===========================================
           2. 基础布局与排版
           =========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            /* 🔴 请确保 mandala.jpg 存在，或者替换为你真实的星空背景路径 */
            background-image: url('mandala.jpg');
            background-size: cover; background-position: center;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            width: 95%; max-width: 1300px; height: 95vh; 
            display: flex; flex-direction: column; justify-content: space-between; 
            position: relative; 
        }

        /* 标题区 */
        .top-panel { text-align: center; margin-bottom: 20px; }
        .hologram-title {
            font-size: 2.2rem; letter-spacing: 4px; font-weight: 600;
            color: #fff; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
        }
        .hologram-subtitle { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 1px; font-weight: 300;}

        /* 网格布局 */
        .synth-grid { 
            display: grid; 
            /* 调整列宽：让 Envelope 面板稍微宽一点，因为它包含横向滑块 */
            grid-template-columns: 1fr 1fr 1.5fr 1fr; 
            gap: 20px; flex-grow: 1; 
        }
        .span-2 { grid-column: span 2; }

        /* ===========================================
           3. 高透玻璃面板 (.glass-panel)
           =========================================== */
        .glass-panel {
            background: var(--glass-bg);
            /* 🔴 核心：降低模糊度，透出背景 */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            
            border: 1px solid var(--glass-border);
            /* 🔴 核心：顶部和左侧高光，勾
