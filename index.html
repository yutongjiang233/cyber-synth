<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Live Automation UI</title>
    <style>
        /* ===========================================
           1. CSS 全局变量
           =========================================== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 0.8s;
            
            --neon-cyan: #00ffff;
            --neon-purple: #ff00ff;
            --neon-blue: #0050ff;
            
            /* 高透玻璃底色 */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%); 
            --glass-border: rgba(0, 255, 255, 0.25);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        /* ===========================================
           2. 基础与排版
           =========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url('mandala.jpg');
            background-size: cover; background-position: center;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            width: 95%; max-width: 1300px; height: 95vh; 
            display: flex; flex-direction: column; justify-content: space-between; position: relative; 
        }

        .top-panel { text-align: center; margin-bottom: 20px; }
        .hologram-title {
            font-size: 2.8rem; 
            letter-spacing: 5px; 
            font-weight: 700;
            color: #fff; 
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 8px;
            /* 合成时的闪烁动画 */
            transition: text-shadow 0.3s;
        }
        .hologram-title.synthesizing {
            animation: text-pulse 1s infinite alternate;
        }
        @keyframes text-pulse {
            0% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5); }
            100% { text-shadow: 0 0 20px var(--neon-purple), 0 0 40px rgba(255, 0, 255, 0.8), 0 0 60px var(--neon-cyan); color: #e0f7fa; }
        }

        .hologram-subtitle { 
            font-size: 1.1rem; color: var(--neon-cyan); letter-spacing: 2px; 
            font-weight: 500; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); 
        }

        .synth-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; flex-grow: 1; }
        .span-2 { grid-column: span 2; }

        /* ===========================================
           3. 高透玻璃面板
           =========================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.2); border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column;
            transition: box-shadow 0.5s, border-color 0.5s; 
        }
        .glass-panel.active-module {
            box-shadow: inset 0 0 30px rgba(255, 0, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 255, 0.2);
            border-color: rgba(255, 0, 255, 0.4);
        }
        .module h2 { 
            font-size: 1.2rem; color: var(--neon-cyan); margin-bottom: 15px; 
            font-weight: 600; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.4); 
            transition: color 0.3s;
        }
        .glass-panel.active-module h2 { color: var(--neon-purple); text-shadow: 0 0 8px rgba(255, 0, 255, 0.6); }

        /* ===========================================
           4. 波形按钮 & Canvas 动态波形展示区
           =========================================== */
        .waveform-group { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }

        .wave-btn {
            flex: 1; aspect-ratio: 1; 
            background-color: transparent; border: none; padding: 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; transition: transform 0.2s ease, filter 0.3s ease; opacity: 0.6;
        }
        .wave-btn:hover { transform: scale(1.05); opacity: 0.8; }
        .wave-btn.active { filter: drop-shadow(0 0 15px rgba(0, 255, 255, 1)); opacity: 1; }
        .wave-btn.auto-active { filter: drop-shadow(0 0 20px var(--neon-purple)); opacity: 1; transform: scale(1.1); }

        .osc-sin { background-image: url('images/osc-sin.png'); }
        .osc-tri { background-image: url('images/osc-tri.png'); }
        .osc-squ { background-image: url('images/osc-squ.png'); }
        .osc-saw { background-image: url('images/osc-saw.png'); }

        .active-wave-display {
            width: 100%; height: 90px; margin-top: 15px;
            background-color: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
        }
        .active-wave-display::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px; pointer-events: none;
        }
        canvas#wave-canvas { width: 100%; height: 100%; display: block; }

        /* ===========================================
           5. 全局发光小圆钮滑块 & 渐变能量尾巴
           =========================================== */
        .control-row-clean { display: flex; flex-direction: column; gap: 20px; }
        
        .slider-item { display: flex; align-items: center; gap: 15px; width: 100%; }
        .slider-item label { width: 80px; font-size: 1.1rem; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); letter-spacing: 1px; }

        .fader-group { 
            display: flex; flex-direction: column; justify-content: center; height: auto; align-items: stretch; 
            gap: 25px; padding: 10px 0; margin-top: 5px;
        }
        .fader-item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .fader-item label { width: auto; font-size: 1.1rem; color: #fff; font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        input[type="range"].auto-slider {
            -webkit-appearance: none; flex-grow: 1; width: 100%; height: 6px; 
            border-radius: 3px; outline: none; cursor: pointer;
            background: linear-gradient(to right, var(--neon-purple) 0%, var(--neon-cyan) var(--slider-fill, 50%), rgba(15, 20, 35, 0.6) var(--slider-fill, 50%), rgba(15, 20, 35, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            transform: none !important; margin-bottom: 0 !important;
            transition: --slider-fill 0.1s linear; 
        }

        input[type="range"].auto-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #fff; border: 2px solid var(--neon-cyan); 
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 4px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.3s; 
        }
        input[type="range"].auto-slider::-webkit-slider-thumb:hover { 
            transform: scale(1.4); box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple); 
        }
        
        .synthesizing input[type="range"].auto-slider::-webkit-slider-thumb {
            box-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-cyan), inset 0 0 4px rgba(0,0,0,0.5);
            border-color: var(--neon-purple);
        }

        /* ===========================================
           6. 配置区 (BPM)
           =========================================== */
        .config-flex { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 30px;}

        .bpm-display { 
            font-size: 3.8rem; font-weight: 800; display: flex; align-items: baseline; gap: 5px; 
            background: linear-gradient(135deg, #00ffff 0%, #7b2cbf 50%, #0050ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(123, 44, 191, 0.8));
            transition: filter 0.5s;
        }
        .synthesizing .bpm-display { filter: drop-shadow(0 0 25px rgba(0, 255, 255, 1)); }

        .bpm-text { font-size: 1rem; font-weight: bold; letter-spacing: 2px; -webkit-text-fill-color: rgba(255, 255, 255, 0.6); }
        .tempo-control-area { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .tempo-slider-container { display: flex; align-items: center; gap: 15px; width: 100%; }
        .tempo-limit { font-size: 1.1rem; color: #fff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* ===========================================
           7. 输入区 & 底部按钮
           =========================================== */
        .input-form { display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; align-items: center; gap: 15px; }
        .input-row label { width: 120px; font-size: 1.1rem; color: var(--text-muted); letter-spacing: 1px;}
        .glow-input {
            flex-grow: 1; padding: 12px 15px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff; font-size: 1.1rem; border-radius: 6px; outline: none; transition: 0.3s;
        }
        .glow-input:focus { border-bottom-color: var(--neon-cyan); background: rgba(0, 255, 255, 0.05); }

        .bottom-action { display: flex; justify-content: center; margin-top: 10px; }
        .synthesize-btn {
            padding: 15px 40px; background: transparent; border: 1px solid var(--neon-cyan);
            border-radius: 30px; color: #fff; font-size: 1.2rem; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; animation: pulse-glow 2s infinite alternate;
            position: relative; overflow: hidden;
        }
        .synthesize-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-cyan); background: rgba(0, 255, 255, 0.1); }
        
        .synthesize-btn.processing {
            background: rgba(255, 0, 255, 0.2); border-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8), inset 0 0 10px rgba(255,0,255,0.5);
            animation: none;
        }
        .synthesize-btn.processing::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scan-light 1.5s infinite linear;
        }
        @keyframes scan-light { 100% { left: 200%; } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); } 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); border-color: #00ffff; } }
        
        .edit-hotzone, .edit-toggle { display: none !important; }

        .reveal { opacity: 0; transform: translateY(40px); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); }
        body.loaded .reveal { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; } .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; } .delay-6 { transition-delay: 0.6s; }
        .delay-7 { transition-delay: 0.7s; }
    </style>
</head>
<body class="loaded">
    <div class="app-container">
        
        <div class="top-panel">
            <h1 class="hologram-title" id="main-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </div>

        <div class="synth-grid" id="main-grid">
            
            <div id="oscillator-container" class="glass-panel module reveal delay-1">
                <h2>I. OSCILLATOR</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="osc-buttons">
                        <button class="wave-btn osc-sin active" data-wave="sine" title="Sine"></button>
                        <button class="wave-btn osc-tri" data-wave="triangle" title="Triangle"></button>
                        <button class="wave-btn osc-squ" data-wave="square" title="Square"></button>

                    </div>
                    <div class="active-wave-display">
                        <canvas id="wave-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div id="filter-container" class="glass-panel module reveal delay-2 auto-panel">
                <h2>II. FILTER</h2>

                    </div>
                </div>

            <div id="lfo-container" class="glass-panel module reveal delay-4 auto-panel">
                <h2>IV. LFO</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="lfo-buttons">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-tri" title="Triangle"></button>

                    </div>
                    <div class="slider-item">
                        <label>Range</label>

            <div id="ritual-config-container" class="glass-panel module reveal delay-5 span-2">

                    <div class="bpm-display"><span id="bpm-value-display">120</span> <span class="bpm-text">BPM</span></div>
                    
                    <div class="tempo-control-area">
                        <label style="color: #fff; font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Tempo Slide</label>
                        <div class="tempo-slider-container">
                            <span class="tempo-limit">70 BPM</span>
                            <input type="range" class="auto-slider tempo-slider" id="tempo-slider" min="70" max="150" value="120" step="1">
                            <span class="tempo-limit">150 BPM</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ritual-input-container" class="glass-panel module reveal delay-6 span-2">
                <h2>SONIC RITUAL SPELL - INPUT</h2>
                <div class="input-form">
                    <div class="input-row">
                        <label>[GENRE]</label>
                        <input type="text" class="glow-input" placeholder="Hard acid techno..." value="Hard acid techno...">
                    </div>
                    <div class="input-row">
                        <label>[SOUNDS]</label>
                        <input type="text" class="glow-input" placeholder="Roland TB-303 squelch..." value="Roland TB-303 squelch, heavy resonance...">
                    </div>
                    <div class="input-row">
                        <label>[STRUCTURE]</label>

        <div class="bottom-action reveal delay-7">
            <button class="synthesize-btn" id="generate-btn">SYNTHESIZE AUDIO RITUAL</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. 滑块渐变尾巴核心功能 ---
            const allSliders = document.querySelectorAll('input[type="range"]');
            function updateSliderTail(slider) {
                const min = slider.min || 0;
                const max = slider.max || 100;
                const val = slider.value;
                const percentage = ((val - min) / (max - min)) * 100;
                slider.style.setProperty('--slider-fill', `${percentage}%`);
            }
            
            allSliders.forEach(slider => {
                updateSliderTail(slider); // 初始化
                slider.addEventListener('input', (e) => {
                    updateSliderTail(e.target);
                    e.target.dataset.manual = "true";
                    clearTimeout(e.target.manualTimeout);
                    e.target.manualTimeout = setTimeout(() => { e.target.dataset.manual = "false"; }, 1500);
                });
            });

            const tempoSlider = document.getElementById('tempo-slider');
            const bpmDisplay = document.getElementById('bpm-value-display');
            tempoSlider.addEventListener('input', (e) => { bpmDisplay.textContent = Math.round(e.target.value); });

            // --- 2. 基础交互：按钮点击 ---
            const oscButtons = document.querySelectorAll('#osc-buttons .wave-btn');
            oscButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    oscButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentWaveType = btn.getAttribute('data-wave');
                    if(!isSynthesizing) playOscillator(currentWaveType);
                });
            });

            const lfoButtons = document.querySelectorAll('#lfo-buttons .wave-btn');
            lfoButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    lfoButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            // --- 3. 🔴 Canvas 核心：动态波形生成引擎 (已修复居中问题) ---
            const canvas = document.getElementById('wave-canvas');
            const ctx = canvas.getContext('2d');
            let currentWaveType = 'sine';
            let isSynthesizing = false;
            let timeOffset = 0; 
            let baseAmplitude = 0.35;
            let baseFrequency = 3;

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawWaveform() {
                const width = canvas.width / window.devicePixelRatio;
                const height = canvas.height / window.devicePixelRatio;
                ctx.clearRect(0, 0, width, height);
                
                ctx.beginPath();
                ctx.lineWidth = 3;
                
                ctx.strokeStyle = isSynthesizing ? '#ff00ff' : '#00ffff'; 
                ctx.shadowBlur = isSynthesizing ? 15 : 10;
                ctx.shadowColor = ctx.strokeStyle;
                
                const centerY = height / 2; // Y轴的正中心
                
                let jitter = isSynthesizing ? (Math.random() * 4 - 2) : 0;
                let activeAmp = height * baseAmplitude * (isSynthesizing ? (0.8 + Math.random()*0.4) : 1);
                let activeFreq = baseFrequency + (isSynthesizing ? Math.sin(timeOffset)*2 : 0);

                for (let x = 0; x < width; x++) {
                    // phase: 0 到 1 之间的值，乘以 2PI 转换为弧度，乘以 frequency 决定显示几个周期
                    const normalizedX = x / width;
                    const phase = (normalizedX * Math.PI * 2 * activeFreq) + timeOffset;
                    
                    let y = centerY;

                    // 🔴 完美的中心对称波形数学公式
                    switch (currentWaveType) {
                        case 'sine':
                            y = centerY - (Math.sin(phase) * activeAmp);
                            break;
                        case 'square':
                            // Math.sin(phase) 大于0时为正峰，小于0时为负峰
                            y = centerY - ((Math.sin(phase) >= 0 ? 1 : -1) * activeAmp);
                            break;
                        case 'triangle':
                            // 标准三角波：使用 asin(sin(x)) 保证以 0 为中心对称
                            y = centerY - ((2 / Math.PI) * Math.asin(Math.sin(phase)) * activeAmp);
                            break;
                        case 'sawtooth':
                            // 标准锯齿波：使用 atan(tan(x)) 或者取模，但必须减去偏移量
                            // -1 到 1 的精确锯齿波：
                            let sawVal = 2 * ((phase / (2 * Math.PI)) - Math.floor((phase / (2 * Math.PI)) + 0.5));
                            y = centerY - (sawVal * activeAmp);
                            break;
                    }
                    
                    if(isSynthesizing) y += (Math.random() * 6 - 3); 

                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                if (isSynthesizing) {
                    timeOffset -= 0.1; 
                } else {
                    timeOffset -= 0.02; 
                }
                requestAnimationFrame(drawWaveform);
            }
            
            // 确保字体等资源加载后执行，防止首次计算错位
            setTimeout(() => { drawWaveform(); }, 100);

            // Web Audio API
            let audioCtx;
            function playOscillator(type) {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05); 
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3); 
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3); 
            }

            // --- 4. 参数自动漂移动画引擎 ---
            const genBtn = document.getElementById('generate-btn');
            const mainTitle = document.getElementById('main-title');
            const mainGrid = document.getElementById('main-grid');
            const autoSliders = Array.from(document.querySelectorAll('input.auto-slider'));
            
            autoSliders.forEach(slider => { slider.targetValue = parseFloat(slider.value); });

            function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

            function animateSliders() {
                if (!isSynthesizing) return; 

                autoSliders.forEach(slider => {
                    if (slider.dataset.manual === "true") return;

                    let currentVal = parseFloat(slider.value);
                    let min = parseFloat(slider.min);
                    let max = parseFloat(slider.max);

                    if (Math.abs(currentVal - slider.targetValue) < 1) {
                        let range = (max - min) * 0.3; 
                        let randomChange = (Math.random() * range) - (range / 2);
                        let nextTarget = currentVal + randomChange;
                        slider.targetValue = Math.max(min, Math.min(max, nextTarget));
                    }

                    let newVal = lerp(currentVal, slider.targetValue, 0.03);
                    slider.value = newVal;
                    updateSliderTail(slider);
                    
                    if(slider.id === 'tempo-slider') {
                        bpmDisplay.textContent = Math.round(newVal);
                    }
                });

                if(Math.random() < 0.02) { 
                    const btns = Array.from(oscButtons);
                    const randomBtn = btns[Math.floor(Math.random() * btns.length)];
                    btns.forEach(b => b.classList.remove('auto-active'));
                    randomBtn.classList.add('auto-active');
                    currentWaveType = randomBtn.getAttribute('data-wave');
                }

                requestAnimationFrame(animateSliders);
            }

            // --- 5. 🔴 终极两步走架构：LLM 扩写 -> 音乐生成 ---
            const genreInput = document.querySelectorAll('.glow-input')[0];
            const soundsInput = document.querySelectorAll('.glow-input')[1];
            const structureInput = document.querySelectorAll('.glow-input')[2];

            let pollInterval; 
            let currentAudio = null; 

            genBtn.addEventListener('click', async () => {
                if (isSynthesizing) return; 
                
                isSynthesizing = true;
                genBtn.classList.add('processing');
                mainTitle.classList.add('synthesizing');
                mainGrid.classList.add('synthesizing');
                
                // 🔴 修改点：将 '.auto-panel' 改成了 '.glass-panel'，让所有面板同时激活变色！
                document.querySelectorAll('.glass-panel').forEach(p => p.classList.add('active-module'));
                
                animateSliders(); 

                if(currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                const fullPrompt = `${genreInput.value}, ${soundsInput.value}, ${structureInput.value}`;
                
                try {
                    // 步骤 1：先呼叫 LLM 大语言模型帮你写“神级咒语”
                    genBtn.textContent = "OPTIMIZING SPELL (AI ASSISTANT)...";
                    
                    const enhanceResponse = await fetch('/api/enhance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: fullPrompt })
                    });
                    const enhanceData = await enhanceResponse.json();
                    
                    // 拿到扩写后的长词（如果报错了，就用原词兜底）
                    const finalPrompt = enhanceData.optimizedPrompt || fullPrompt;
                    console.log("🔥 AI 自动为你定制的提示词:", finalPrompt); // 按 F12 可以在控制台偷看 AI 帮你写了什么！

                    // 步骤 2：拿着定制好的长词，去呼叫音乐大模型
                    genBtn.textContent = "COMMUNICATING WITH DiT CORE...";
                    
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: finalPrompt })
                    });

                    let prediction = await response.json();
                    if (response.status !== 201) throw new Error(prediction.detail || "API Error");

                    // 步骤 3：开始轮询进度
                    pollInterval = setInterval(async () => {
                        const statusResponse = await fetch(`/api/status?id=${prediction.id}`);
                        let statusData = await statusResponse.json();

                        genBtn.textContent = `SYNTHESIZING... [${statusData.status.toUpperCase()}]`;

                        if (statusData.status === "succeeded") {
                            clearInterval(pollInterval);
                            const audioUrl = Array.isArray(statusData.output) ? statusData.output[0] : statusData.output; 
                            currentAudio = new Audio(audioUrl);
                            currentAudio.play();
                            resetUI("RITUAL COMPLETE - PLAYING...");
                            currentAudio.onended = () => { genBtn.textContent = "SYNTHESIZE AUDIO RITUAL"; };
                        } else if (statusData.status === "failed" || statusData.status === "canceled") {
                            clearInterval(pollInterval);
                            resetUI("RITUAL FAILED - TRY AGAIN");
                        }
                    }, 3000);

                } catch (error) {
                    console.error("Error:", error);
                    resetUI("SYSTEM ERROR - OFFLINE");
                }
            });

            function resetUI(buttonText) {
                isSynthesizing = false;
                genBtn.textContent = buttonText;
                genBtn.classList.remove('processing');
                mainTitle.classList.remove('synthesizing');
                mainGrid.classList.remove('synthesizing');
                
                // 🔴 修改点：停止生成时，将所有面板的变色状态移除
                document.querySelectorAll('.glass-panel').forEach(p => p.classList.remove('active-module'));
                
                oscButtons.forEach(b => b.classList.remove('auto-active'));
                autoSliders.forEach(slider => slider.targetValue = parseFloat(slider.value));
                setTimeout(() => { if(!currentAudio || currentAudio.paused) genBtn.textContent = "SYNTHESIZE AUDIO RITUAL"; }, 3000);
            }

        });
    </script>
</body>
</html>
