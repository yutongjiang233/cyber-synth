<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Interactive UI</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="loaded">
    <div class="app-container">
        
        <div class="top-panel">
            <h1 class="hologram-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </div>

        <div class="synth-grid">
            
            <div id="oscillator-container" class="glass-panel module reveal delay-1">
                <h2>I. OSCILLATOR</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="osc-buttons">
                        <button class="wave-btn osc-sin active" data-wave="sine" title="Sine"></button>
                        <button class="wave-btn osc-tri" data-wave="triangle" title="Triangle"></button>
                        <button class="wave-btn osc-squ" data-wave="square" title="Square"></button>
                        <button class="wave-btn osc-saw" data-wave="sawtooth" title="Sawtooth"></button>
                    </div>
                    <div class="active-wave-display">
                        <canvas id="wave-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div id="filter-container" class="glass-panel module reveal delay-2">
                <h2>II. FILTER</h2>
                <div class="fader-group">
                    <div class="fader-item">
                        <input type="range" class="neon-slider" min="0" max="100" value="70">
                        <label>Cutoff</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="neon-slider" min="0" max="100" value="40">
                        <label>Resonance</label>
                    </div>
                </div>
            </div>

            <div id="envelope-container" class="glass-panel module reveal delay-3">
                <h2>III. ENVELOPE</h2>
                <div class="fader-group">
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="40">
                        <label>Attack</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="60">
                        <label>Decay</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="50">
                        <label>Sustain</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="80">
                        <label>Release</label>
                    </div>
                </div>
            </div>

            <div id="lfo-container" class="glass-panel module reveal delay-4">
                <h2>IV. LFO</h2>
                <div class="control-row-clean">
                    <div class="waveform-group">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-tri" title="Triangle"></button>
                        <button class="wave-btn osc-squ" title="Square"></button>
                        <button class="wave-btn osc-saw" title="Sawtooth"></button>
                    </div>
                    <div class="slider-item">
                        <label>Range</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="60">
                    </div>
                    <div class="slider-item">
                        <label>Depth</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="90">
                    </div>
                </div>
            </div>

            <div id="ritual-config-container" class="glass-panel module reveal delay-5 span-2">
                <h2>RITUAL CONFIGURATION</h2>
                <div class="config-flex">
                    <div class="bpm-display"><span id="bpm-value-display">120</span> <span class="bpm-text">BPM</span></div>
                    
                    <div class="tempo-control-area">
                        <label style="color: #fff; font-weight: 600; font-size: 0.95rem; margin-bottom: 5px;">Tempo Slide</label>
                        <div class="tempo-slider-container">
                            <span class="tempo-limit">70 BPM</span>
                            <input type="range" class="neon-slider" id="tempo-slider" min="70" max="150" value="120">
                            <span class="tempo-limit">150 BPM</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ritual-input-container" class="glass-panel module reveal delay-6 span-2">
                <h2>SONIC RITUAL SPELL - INPUT</h2>
                <div class="input-form">
                    <div class="input-row">
                        <label>[GENRE]</label>
                        <input type="text" class="glow-input" placeholder="Hard acid techno..." value="Hard acid techno...">
                    </div>
                    <div class="input-row">
                        <label>[SOUNDS]</label>
                        <input type="text" class="glow-input" placeholder="Roland TB-303 squelch..." value="Roland TB-303 squelch, heavy resonance...">
                    </div>
                    <div class="input-row">
                        <label>[STRUCTURE]</label>
                        <input type="text" class="glow-input" placeholder="Ambient build to driving drop..." value="Ambient build to driving drop...">
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-action reveal delay-7">
            <button class="synthesize-btn">SYNTHESIZE AUDIO RITUAL</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. BPM 滑块联动 ---
            const tempoSlider = document.getElementById('tempo-slider');
            const bpmDisplay = document.getElementById('bpm-value-display');
            
            tempoSlider.addEventListener('input', (e) => {
                bpmDisplay.textContent = e.target.value;
            });

            // --- 2. Canvas 波形绘制逻辑 ---
            const canvas = document.getElementById('wave-canvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawWaveform(type) {
                const width = canvas.width / window.devicePixelRatio;
                const height = canvas.height / window.devicePixelRatio;
                
                ctx.clearRect(0, 0, width, height);
                
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ffff'; 
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                
                const centerY = height / 2;
                const amplitude = height * 0.35; 
                const frequency = 3; 

                for (let x = 0; x < width; x++) {
                    const phase = (x / width) * Math.PI * 2 * frequency;
                    let y = centerY;

                    switch (type) {
                        case 'sine':
                            y = centerY - Math.sin(phase) * amplitude;
                            break;
                        case 'square':
                            y = centerY - (Math.sin(phase) > 0 ? 1 : -1) * amplitude;
                            break;
                        case 'triangle':
                            y = centerY - (Math.abs((phase / Math.PI) % 2 - 1) * 2 - 1) * amplitude;
                            break;
                        case 'sawtooth':
                            y = centerY - (((phase / Math.PI) % 2) - 1) * amplitude;
                            break;
                    }

                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
            // 确保字体加载后再绘制，或者延迟一点点绘制
            setTimeout(() => { drawWaveform('sine'); }, 100);

            // --- 3. Web Audio API 发声逻辑 ---
            let audioCtx;
            function playOscillator(type) {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type; 
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.4); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5); 

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5); 
            }

            // --- 4. 绑定按钮点击事件 ---
            const oscButtons = document.querySelectorAll('#osc-buttons .wave-btn');
            oscButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    oscButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const waveType = btn.getAttribute('data-wave');
                    drawWaveform(waveType);
                    playOscillator(waveType);
                });
            });
        });
    </script>
</body>
</html>
