<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Advanced Ritual UI</title>
    <style>
        /* ===========================================
           CSS 变量定义 (全局色彩与动画曲线)
           =========================================== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 0.8s;
            
            --neon-cyan: #00ffff;
            --neon-purple: #ff00ff;
            --glass-bg: rgba(15, 20, 35, 0.5); /* Semi-transparent panel background */
            --glass-border: rgba(0, 255, 255, 0.25);
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            
            /* 🔴 新增点 5: 字体变量资产 figure-two Figure Two style 字体Figure Two Figure Two Figure Two style figure-two */
            --font-figure-two: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===========================================
           基础与排版
           =========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url('mandala.jpg'); /* Background pattern */
            background-size: cover; background-position: center;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { width: 95%; max-width: 1300px; height: 95vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; }

        /* 标题区 */
        .top-panel { text-align: center; margin-bottom: 20px; }
        .hologram-title {
            font-size: 2.2rem; letter-spacing: 4px; font-weight: 600;
            color: #fff; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
        }
        .hologram-subtitle { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 1px; font-weight: 300;}

        /* 网格布局 */
        .synth-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; flex-grow: 1; }
        .span-2 { grid-column: span 2; }

        /* ===========================================
           高透玻璃面板核心逻辑
           =========================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 255, 0.05),
                0 8px 32px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.4s var(--ease-out-expo);
        }
        .glass-panel:hover {
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .module h2 { font-size: 0.9rem; color: var(--neon-cyan); margin-bottom: 15px; font-weight: 500; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.4); }

        /* ===========================================
           🌟 专业 PNG 资产波形按钮 (指定到 images 文件夹) - 原封不动！
           =========================================== */
        .waveform-group { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
        .waveform-group.small { justify-content: flex-start; gap: 8px; }
        .waveform-group.small .wave-btn { flex: none; width: 40px; }

        .wave-btn {
            flex: 1; 
            aspect-ratio: 1; /* Keep it perfectly square */
            background-color: transparent; border: none; box-shadow: none; padding: 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; transition: transform 0.2s ease, filter 0.3s ease;
        }

        .wave-btn:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6)); 
        }
        .wave-btn.active {
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 1)); 
        }

        /* 核心：精确指向 images 文件夹里的资产 assets asset assets assets */
        .osc-sin { background-image: url('images/osc-sin.png'); }
        .osc-tri { background-image: url('images/osc-tri.png'); }
        .osc-squ { background-image: url('images/osc-squ.png'); }
        .osc-saw { background-image: url('images/osc-saw.png'); }

        /* ===========================================
           霓虹滑块推杆 & 输入框
           =========================================== */
        .control-row-clean, .fader-group { display: flex; flex-direction: column; gap: 15px; }
        .fader-group { flex-direction: row; justify-content: space-around; height: 120px; align-items: flex-end; }
        .slider-item, .fader-item { display: flex; align-items: center; gap: 12px; }
        .fader-item { flex-direction: column; }
        .slider-item label, .fader-item label { width: 60px; font-size: 0.8rem; color: var(--text-muted); font-weight: 500;}

        input[type="range"].neon-slider {
            -webkit-appearance: none; flex-grow: 1; height: 4px;
            background: rgba(255, 255, 255, 0.1); border-radius: 2px; outline: none; cursor: pointer;
        }
        input[type="range"].neon-slider.vertical { transform: rotate(-90deg); width: 80px; margin-bottom: 40px; }
        input[type="range"].neon-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); transition: transform 0.1s;
        }
        input[type="range"].neon-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /* 🟢 修改点 4: 字体资产 Figure Two Figure Two 字体Figure Two style figure-two Figure Two Figure Two */
        .figure-two-label {
            font-family: var(--font-figure-two) !important;
            font-size: 1.1rem !important; /* Larger font Figure Two style figure-two */
            color: var(--text-main) !important;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 输入框 */
        .input-form { display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; align-items: center; gap: 15px; }
        .input-row label { width: 90px; font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px;}
        .glow-input {
            flex-grow: 1; padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff; font-size: 0.9rem; border-radius: 6px; outline: none; transition: 0.3s;
        }
        .glow-input:focus { border-bottom-color: var(--neon-cyan); background: rgba(0, 255, 255, 0.05); }

        /* 配置区 */
        .config-flex { display: flex; align-items: center; justify-content: space-around; height: 100%; gap: 20px;}
        .bpm-display { font-size: 3rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px var(--neon-purple); display: flex; align-items: baseline; gap: 5px; }
        .bpm-text { font-size: 1rem; color: var(--text-muted); font-weight: normal; text-shadow: none; }
        .tempo-slider-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .tempo-slider-wrapper label { font-size: 0.8rem; color: var(--text-muted); }

        /* ===========================================
           纯 CSS 动态数据流可视化
           =========================================== */
        .visualizer-box {
            height: 70px; border-radius: 6px; margin-top: 15px; position: relative; overflow: hidden;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .wave-vis::before {
            content: ''; position: absolute; top: 0; left: 0; width: 200%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 255, 255, 0.4) 50%, transparent 100%);
            animation: flow-wave 2.5s infinite linear; filter: blur(5px);
        }
        .wave-vis::after {
            content: ''; position: absolute; top: 30%; left: 0; width: 200%; height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: flow-wave 2s infinite linear reverse; box-shadow: 0 0 10px var(--neon-cyan);
        }
        @keyframes flow-wave { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }

        .spec-vis { display: flex; align-items: flex-end; justify-content: space-around; padding: 10px 5px; }
        .spec-vis::before {
            content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,255,255,0.2) 4px, rgba(0,255,255,0.2) 8px);
            mask-image: linear-gradient(to top, black 0%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 80%);
        }

        /* ===========================================
           底部按钮 & 隐形开关
           =========================================== */
        .bottom-action { display: flex; justify-content: center; margin-top: 10px; }
        .synthesize-btn {
            padding: 15px 40px; background: transparent; border: 1px solid var(--neon-purple);
            border-radius: 30px; color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; animation: pulse-glow 2s infinite alternate;
        }
        .synthesize-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-purple); background: rgba(255, 0, 255, 0.1); }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px rgba(255, 0, 255, 0.3); } 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.8), inset 0 0 10px rgba(255, 0, 255, 0.4); border-color: #ffaaff; } }

        /* 🔴 修改点 3: 隐形开关 Edit Toggle Edit Ritual */
        .edit-hotzone, .edit-toggle { display: none !important; }

        /* ===========================================
           入场瀑布流动效
           =========================================== */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); }
        body.loaded .reveal { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; } .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; } .delay-6 { transition-delay: 0.6s; }
        .delay-7 { transition-delay: 0.7s; }
    </style>
</head>
<body class="loaded">
    
    <div class="edit-hotzone"></div>
    <div class="edit-toggle active">EDIT RITUAL</div>

    <div class="app-container reveal">
        
        <div class="top-panel">
            <h1 class="hologram-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </div>

        <div class="synth-grid">
            
            <div id="oscillator-container" class="glass-panel module reveal delay-1">
                <h2>I. OSCILLATOR</h2>
                <div class="control-row-clean">
                    <div class="waveform-group">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-tri" title="Triangle"></button>
                        <button class="wave-btn osc-squ" title="Square"></button>
                        <button class="wave-btn osc-saw" title="Sawtooth"></button>
                    </div>
                    <div class="visualizer-box wave-vis"></div>
                </div>
            </div>

            <div id="filter-container" class="glass-panel module reveal delay-2">
                <h2>II. FILTER</h2>
                <div class="control-row-clean">
                    <div class="slider-item">
                        <label class="figure-two-label">Cutoff</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="70">
                    </div>
                    <div class="slider-item">
                        <label class="figure-two-label">Resonance</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="40">
                    </div>
                    <div class="waveform-group small">
                        <button class="wave-btn osc-sin active" title="Lowpass"></button>
                        </div>
                    <div class="visualizer-box spec-vis"></div>
                </div>
            </div>

            <div id="envelope-container" class="glass-panel module reveal delay-3">
                <h2>III. ENVELOPE</h2>
                <div class="control-row-clean">
                    <div class="waveform-group">
                        <button class="wave-btn osc-sin active" title="Attack"></button>
                        <button class="wave-btn osc-tri" title="Decay"></button>
                        <button class="wave-btn osc-squ" title="Sustain"></button>
                        <button class="wave-btn osc-saw" title="Release"></button>
                    </div>
                    <div class="fader-group">
                        <div class="fader-item">
                            <input type="range" class="neon-slider vertical" min="0" max="100" value="70">
                            <label>Attack</label>
                        </div>
                        <div class="fader-item">
                            <input type="range" class="neon-slider vertical" min="0" max="100" value="50">
                            <label>Decay</label>
                        </div>
                        <div class="fader-item">
                            <input type="range" class="neon-slider vertical" min="0" max="100" value="80">
                            <label>Sustain</label>
                        </div>
                        <div class="fader-item">
                            <input type="range" class="neon-slider vertical" min="0" max="100" value="30">
                            <label>Release</label>
                        </div>
                    </div>
                </div>
            </div>

            <div id="lfo-container" class="glass-panel module reveal delay-4">
                <h2>IV. LFO</h2>
                <div class="control-row-clean">
                    <div class="waveform-group">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-squ" title="Triangle"></button>
                        <button class="wave-btn osc-saw" title="Square"></button>
                    </div>
                    <div class="slider-item">
                        <label class="figure-two-label">Range</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="60">
                    </div>
                    <div class="slider-item">
                        <label class="figure-two-label">Depth</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="90">
                    </div>
                </div>
            </div>

            <div id="ritual-config-container" class="glass-panel module reveal delay-5 span-2">
                <h2>RITUAL CONFIGURATION</h2>
                <div class="config-flex">
                    <div class="bpm-display">120 <span class="bpm-text">BPM</span></div>
                    <div class="tempo-slider-wrapper">
                        <label class="figure-two-label">Tempo Slide</label>
                        <input type="range" class="neon-slider" min="40" max="220" value="120">
                    </div>
                    <div class="visualizer-box spec-vis"></div>
                </div>
            </div>

            <div id="ritual-input-container" class="glass-panel module reveal delay-6 span-2">
                <h2>SONIC RITUAL SPELL - INPUT</h2>
                <div class="input-form">
                    <div class="input-row">
                        <label>[GENRE]</label>
                        <input type="text" class="glow-input" placeholder="Hard acid techno..." value="Hard acid techno...">
                    </div>
                    <div class="input-row">
                        <label>[SOUNDS]</label>
                        <input type="text" class="glow-input" placeholder="Roland TB-303 squelch, heavy resonance..." value="Roland TB-303 squelch, heavy resonance...">
                    </div>
                    <div class="input-row">
                        <label>[STRUCTURE]</label>
                        <input type="text" class="glow-input" placeholder="Ambient build to driving drop..." value="Ambient build to driving drop...">
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-action reveal delay-7">
            <button class="synthesize-btn">SYNTHESIZE AUDIO RITUAL</button>
        </div>

    </div>
</body>
</html>
