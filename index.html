<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Interactive UI</title>
    <style>
        /* ===========================================
           1. CSS 全局变量
           =========================================== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 0.8s;
            
            --neon-cyan: #00ffff;
            --neon-purple: #ff00ff;
            --neon-blue: #0050ff;
            
            /* 高透玻璃底色 */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%); 
            --glass-border: rgba(0, 255, 255, 0.25);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        /* ===========================================
           2. 基础与排版
           =========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-image: url('mandala.jpg');
            background-size: cover; background-position: center;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            width: 95%; max-width: 1300px; height: 95vh; 
            display: flex; flex-direction: column; justify-content: space-between; position: relative; 
        }

        /* 🔴 修改点 2 & 3: 标题区字体变大，副标题颜色同步 */
        .top-panel { text-align: center; margin-bottom: 20px; }
        .hologram-title {
            font-size: 2.8rem; /* 主标题更大了 */
            letter-spacing: 5px; 
            font-weight: 700;
            color: #fff; 
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 8px;
        }
        .hologram-subtitle { 
            font-size: 1.1rem; /* 副标题稍微大一点 */
            color: var(--neon-cyan); /* 颜色同步为青色 */
            letter-spacing: 2px; 
            font-weight: 500;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); /* 增加发光效果，更清晰 */
        }

        .synth-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; flex-grow: 1; }
        .span-2 { grid-column: span 2; }

        /* ===========================================
           3. 高透玻璃面板
           =========================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column;
        }
        /* 🔴 修改点 2: 模块标题字体变大 */
        .module h2 { 
            font-size: 1.2rem; 
            color: var(--neon-cyan); margin-bottom: 15px; 
            font-weight: 600; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.4); 
        }

        /* ===========================================
           4. 波形按钮 & Canvas 动态波形展示区
           =========================================== */
        .waveform-group { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }

        .wave-btn {
            flex: 1; aspect-ratio: 1; 
            background-color: transparent; border: none; padding: 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; transition: transform 0.2s ease, filter 0.3s ease; opacity: 0.6;
        }
        .wave-btn:hover { transform: scale(1.05); opacity: 0.8; }
        .wave-btn.active { filter: drop-shadow(0 0 15px rgba(0, 255, 255, 1)); opacity: 1; }

        .osc-sin { background-image: url('images/osc-sin.png'); }
        .osc-tri { background-image: url('images/osc-tri.png'); }
        .osc-squ { background-image: url('images/osc-squ.png'); }
        .osc-saw { background-image: url('images/osc-saw.png'); }

        .active-wave-display {
            width: 100%; height: 90px; margin-top: 15px;
            background-color: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
        }
        .active-wave-display::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px; pointer-events: none;
        }
        canvas#wave-canvas { width: 100%; height: 100%; display: block; }

        /* ===========================================
           5. 全局发光小圆钮滑块 & 渐变能量尾巴
           =========================================== */
        .control-row-clean { display: flex; flex-direction: column; gap: 20px; }
        
        /* 左右排列模式 (用于 LFO 和 Tempo) */
        .slider-item { display: flex; align-items: center; gap: 15px; width: 100%; }
        /* 🔴 修改点 2: 标签字体变大 */
        .slider-item label { width: 80px; font-size: 1.1rem; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); letter-spacing: 1px; }

        /* 上下堆叠排列模式 (用于 Filter 和 Envelope) */
        .fader-group { 
            display: flex; flex-direction: column; 
            justify-content: center; height: auto; align-items: stretch; 
            gap: 25px; 
            padding: 10px 0; margin-top: 5px;
        }
        .fader-item { 
            display: flex; flex-direction: column; 
            align-items: center; 
            gap: 8px; 
            width: 100%; 
        }
        /* 🔴 修改点 2: 标签字体变大 */
        .fader-item label { 
            width: auto; font-size: 1.1rem; color: #fff; 
            font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 轨道 & 渐变尾巴 */
        input[type="range"] {
            -webkit-appearance: none; 
            flex-grow: 1; 
            width: 100%; 
            height: 6px; 
            border-radius: 3px; 
            outline: none; 
            cursor: pointer;
            background: linear-gradient(
                to right, 
                var(--neon-purple) 0%, 
                var(--neon-cyan) var(--slider-fill, 50%), 
                rgba(15, 20, 35, 0.6) var(--slider-fill, 50%), 
                rgba(15, 20, 35, 0.6) 100%
            );
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            transform: none !important; margin-bottom: 0 !important;
        }

        /* 发光小圆钮把手 */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;  
            height: 16px; 
            border-radius: 50%;
            background: #fff; 
            border: 2px solid var(--neon-cyan); 
            box-shadow: 
                0 0 10px var(--neon-cyan), 
                0 0 20px rgba(0, 255, 255, 0.6),
                inset 0 0 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover { 
            transform: scale(1.4); 
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple); 
        }

        /* ===========================================
           6. 配置区 (BPM 迷幻深邃渐变色)
           =========================================== */
        .config-flex { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 30px;}

        .bpm-display { 
            font-size: 3.8rem; font-weight: 800; display: flex; align-items: baseline; gap: 5px; 
            background: linear-gradient(135deg, #00ffff 0%, #7b2cbf 50%, #0050ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(123, 44, 191, 0.8));
        }
        .bpm-text { 
            font-size: 1rem; font-weight: bold; letter-spacing: 2px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.6);
        }

        .tempo-control-area { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .tempo-slider-container { display: flex; align-items: center; gap: 15px; width: 100%; }
        /* 🔴 修改点 2: Tempo 标签变大 */
        .tempo-limit { font-size: 1.1rem; color: #fff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* ===========================================
           7. 输入区 & 底部按钮
           =========================================== */
        .input-form { display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; align-items: center; gap: 15px; }
        /* 🔴 修改点 2: 标签变大 */
        .input-row label { width: 120px; font-size: 1.1rem; color: var(--text-muted); letter-spacing: 1px;}
        .glow-input {
            flex-grow: 1; padding: 12px 15px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff; 
            font-size: 1.1rem; /* 🔴 修改点 2: 输入框内文字变大 */
            border-radius: 6px; outline: none; transition: 0.3s;
        }
        .glow-input:focus { border-bottom-color: var(--neon-cyan); background: rgba(0, 255, 255, 0.05); }

        .bottom-action { display: flex; justify-content: center; margin-top: 10px; }
        .synthesize-btn {
            padding: 15px 40px; background: transparent; border: 1px solid var(--neon-cyan);
            border-radius: 30px; color: #fff; font-size: 1.2rem; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; animation: pulse-glow 2s infinite alternate;
        }
        .synthesize-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-cyan); background: rgba(0, 255, 255, 0.1); }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); } 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); border-color: #00ffff; } }
        .edit-hotzone, .edit-toggle { display: none !important; }

        /* ===========================================
           8. 入场动效
           =========================================== */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); }
        body.loaded .reveal { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; } .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; } .delay-6 { transition-delay: 0.6s; }
        .delay-7 { transition-delay: 0.7s; }
    </style>
</head>
<body class="loaded">
    <div class="app-container">
        
        <div class="top-panel">
            <h1 class="hologram-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </div>

        <div class="synth-grid">
            
            <div id="oscillator-container" class="glass-panel module reveal delay-1">
                <h2>I. OSCILLATOR</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="osc-buttons">
                        <button class="wave-btn osc-sin active" data-wave="sine" title="Sine"></button>
                        <button class="wave-btn osc-tri" data-wave="triangle" title="Triangle"></button>
                        <button class="wave-btn osc-squ" data-wave="square" title="Square"></button>
                        <button class="wave-btn osc-saw" data-wave="sawtooth" title="Sawtooth"></button>
                    </div>
                    <div class="active-wave-display">
                        <canvas id="wave-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div id="filter-container" class="glass-panel module reveal delay-2">
                <h2>II. FILTER</h2>
                <div class="fader-group">
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="70">
                        <label>Cutoff</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="40">
                        <label>Resonance</label>
                    </div>
                </div>
            </div>

            <div id="envelope-container" class="glass-panel module reveal delay-3">
                <h2>III. ENVELOPE</h2>
                <div class="fader-group">
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="40">
                        <label>Attack</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="60">
                        <label>Decay</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="50">
                        <label>Sustain</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" min="0" max="100" value="80">
                        <label>Release</label>
                    </div>
                </div>
            </div>

            <div id="lfo-container" class="glass-panel module reveal delay-4">
                <h2>IV. LFO</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="lfo-buttons">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-tri" title="Triangle"></button>
                        <button class="wave-btn osc-squ" title="Square"></button>
                        <button class="wave-btn osc-saw" title="Sawtooth"></button>
                    </div>
                    <div class="slider-item">
                        <label>Range</label>
                        <input type="range" min="0" max="100" value="60">
                    </div>
                    <div class="slider-item">
                        <label>Depth</label>
                        <input type="range" min="0" max="100" value="90">
                    </div>
                </div>
            </div>

            <div id="ritual-config-container" class="glass-panel module reveal delay-5 span-2">
                <h2>RITUAL CONFIGURATION</h2>
                <div class="config-flex">
                    <div class="bpm-display"><span id="bpm-value-display">120</span> <span class="bpm-text">BPM</span></div>
                    
                    <div class="tempo-control-area">
                        <label style="color: #fff; font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Tempo Slide</label>
                        <div class="tempo-slider-container">
                            <span class="tempo-limit">70 BPM</span>
                            <input type="range" id="tempo-slider" min="70" max="150" value="120">
                            <span class="tempo-limit">150 BPM</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ritual-input-container" class="glass-panel module reveal delay-6 span-2">
                <h2>SONIC RITUAL SPELL - INPUT</h2>
                <div class="input-form">
                    <div class="input-row">
                        <label>[GENRE]</label>
                        <input type="text" class="glow-input" placeholder="Hard acid techno..." value="Hard acid techno...">
                    </div>
                    <div class="input-row">
                        <label>[SOUNDS]</label>
                        <input type="text" class="glow-input" placeholder="Roland TB-303 squelch..." value="Roland TB-303 squelch, heavy resonance...">
                    </div>
                    <div class="input-row">
                        <label>[STRUCTURE]</label>
                        <input type="text" class="glow-input" placeholder="Ambient build to driving drop..." value="Ambient build to driving drop...">
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-action reveal delay-7">
            <button class="synthesize-btn">SYNTHESIZE AUDIO RITUAL</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. 动态更新滑块渐变尾巴的函数 ---
            const allSliders = document.querySelectorAll('input[type="range"]');
            
            function updateSliderTail(slider) {
                const min = slider.min || 0;
                const max = slider.max || 100;
                const val = slider.value;
                const percentage = ((val - min) / (max - min)) * 100;
                slider.style.setProperty('--slider-fill', `${percentage}%`);
            }

            allSliders.forEach(slider => {
                updateSliderTail(slider); 
                slider.addEventListener('input', (e) => {
                    updateSliderTail(e.target);
                });
            });

            // --- 2. BPM 滑块联动 ---
            const tempoSlider = document.getElementById('tempo-slider');
            const bpmDisplay = document.getElementById('bpm-value-display');
            
            tempoSlider.addEventListener('input', (e) => {
                bpmDisplay.textContent = e.target.value;
            });

            // --- 3. Canvas 波形绘制逻辑 ---
            const canvas = document.getElementById('wave-canvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawWaveform(type) {
                const width = canvas.width / window.devicePixelRatio;
                const height = canvas.height / window.devicePixelRatio;
                
                ctx.clearRect(0, 0, width, height);
                
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ffff'; 
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                
                const centerY = height / 2;
                const amplitude = height * 0.35; 
                const frequency = 3; 

                for (let x = 0; x < width; x++) {
                    const phase = (x / width) * Math.PI * 2 * frequency;
                    let y = centerY;

                    switch (type) {
                        case 'sine': y = centerY - Math.sin(phase) * amplitude; break;
                        case 'square': y = centerY - (Math.sin(phase) > 0 ? 1 : -1) * amplitude; break;
                        case 'triangle': y = centerY - (Math.abs((phase / Math.PI) % 2 - 1) * 2 - 1) * amplitude; break;
                        case 'sawtooth': y = centerY - (((phase / Math.PI) % 2) - 1) * amplitude; break;
                    }

                    if (x === 0) { ctx.moveTo(x, y); } 
                    else { ctx.lineTo(x, y); }
                }
                ctx.stroke();
            }
            setTimeout(() => { drawWaveform('sine'); }, 100);

            // --- 4. Web Audio API 发声逻辑 ---
            let audioCtx;
            function playOscillator(type) {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type; 
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.4); 
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5); 

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5); 
            }

            // --- 5. 绑定 Oscillator 按钮点击事件 ---
            const oscButtons = document.querySelectorAll('#osc-buttons .wave-btn');
            oscButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    oscButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const waveType = btn.getAttribute('data-wave');
                    drawWaveform(waveType);
                    playOscillator(waveType);
                });
            });

            // --- 6. 🔴 绑定 LFO 按钮点击事件 (仅高亮，不发声) ---
            const lfoButtons = document.querySelectorAll('#lfo-buttons .wave-btn');
            lfoButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 移除 LFO 模块内其他按钮的高亮
                    lfoButtons.forEach(b => b.classList.remove('active'));
                    // 高亮当前点击的按钮
                    btn.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
