<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - Interactive UI</title>
    <style>
        /* ===========================================
           1. CSS 全局变量
           =========================================== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 0.8s;
            --neon-cyan: #00ffff;
            --neon-purple: #ff00ff;
            
            /* 高透玻璃质感 */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%); 
            --glass-border: rgba(0, 255, 255, 0.25);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.6);
            
            /* 大字体样式 */
            --label-font-size: 1.1rem;
        }

        /* ===========================================
           2. 基础与排版
           =========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            /* 确保背景图路径正确 */
            background-image: url('mandala.jpg');
            background-size: cover; background-position: center;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            width: 95%; max-width: 1300px; height: 95vh; 
            display: flex; flex-direction: column; justify-content: space-between; position: relative; 
        }

        .top-panel { text-align: center; margin-bottom: 20px; }
        .hologram-title {
            font-size: 2.2rem; letter-spacing: 4px; font-weight: 600;
            color: #fff; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
        }
        .hologram-subtitle { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 1px; font-weight: 300;}

        .synth-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; flex-grow: 1; }
        .span-2 { grid-column: span 2; }

        /* ===========================================
           3. 高透玻璃面板
           =========================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column;
        }
        .module h2 { 
            font-size: 1rem; color: var(--neon-cyan); margin-bottom: 15px; 
            font-weight: 600; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.4); 
        }

        /* ===========================================
           4. 波形按钮 (Oscillator 和 LFO 共用)
           =========================================== */
        .waveform-group { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }

        .wave-btn {
            flex: 1; aspect-ratio: 1; 
            background-color: transparent; border: none; padding: 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            cursor: pointer; transition: transform 0.2s ease, filter 0.3s ease;
            opacity: 0.6; /* 默认微暗 */
        }
        .wave-btn:hover { transform: scale(1.05); opacity: 0.8; }
        .wave-btn.active { filter: drop-shadow(0 0 15px rgba(0, 255, 255, 1)); opacity: 1; }

        /* 指向你的四张抠图资产 */
        .osc-sin { background-image: url('images/osc-sin.png'); }
        .osc-tri { background-image: url('images/osc-tri.png'); }
        .osc-squ { background-image: url('images/osc-squ.png'); }
        .osc-saw { background-image: url('images/osc-saw.png'); }

        /* 🔴 核心更新：Canvas 波形展示区 */
        .active-wave-display {
            width: 100%;
            height: 90px;
            margin-top: 15px;
            background-color: rgba(0, 0, 0, 0.4); /* 深色背景底 */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8); /* 强烈内阴影营造屏幕感 */
            display: flex; justify-content: center; align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* 为了让波形看起来有那种老式示波器的扫描感，我们可以加个微弱的背景网格 */
        .active-wave-display::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            pointer-events: none;
        }

        canvas#wave-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===========================================
           5. 标签字体加大 
           =========================================== */
        .large-label {
            font-size: var(--label-font-size);
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap; 
        }

        /* ===========================================
           6. 滑块样式 (分为普通小圆点和自定义图片)
           =========================================== */
        .control-row-clean { display: flex; flex-direction: column; gap: 20px; }
        
        /* 普通滑块行 (Filter, LFO) */
        .slider-item { display: flex; align-items: center; gap: 15px; }
        .slider-item label { width: 80px; }

        /* 基础轨道 */
        input[type="range"].neon-slider {
            -webkit-appearance: none; flex-grow: 1; width: 100%; height: 6px;
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 3px; outline: none; cursor: pointer;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
        }

        /* 普通把手 (青色小圆点) */
        input[type="range"].neon-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); transition: transform 0.1s;
        }
        input[type="range"].neon-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /* ===========================================
           7. Envelope 专属：图片水滴滑块 (使用 nob.png)
           =========================================== */
        .fader-group { 
            display: flex; flex-direction: column; gap: 25px; 
            padding: 10px 0; margin-top: 5px;
        }
        
        .fader-item { 
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; 
        }

        input[type="range"].envelope-slider {
            -webkit-appearance: none; width: 100%; height: 8px;
            background: rgba(15, 20, 35, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px; outline: none; cursor: pointer;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        /* 使用你的 nob.png 作为 Envelope 的滑块把手 */
        input[type="range"].envelope-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            
            /* 🔴 请根据 nob.png 实际比例调整这里，防止变形 */
            width: 45px;  
            height: 25px; 
            
            background-color: transparent; border-radius: 0; box-shadow: none;
            background-image: url('images/nob.png'); 
            background-size: contain; background-repeat: no-repeat; background-position: center;
            
            margin-top: -8px; 
            transition: filter 0.2s, transform 0.1s;
        }
        input[type="range"].envelope-slider::-webkit-slider-thumb:hover { 
            transform: scale(1.05); filter: brightness(1.2) drop-shadow(0 0 5px rgba(77, 240, 255, 0.5)); 
        }

        /* ===========================================
           8. 配置区 (BPM 滑块)
           =========================================== */
        .config-flex { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 30px;}
        .bpm-display { font-size: 3.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px var(--neon-purple); display: flex; align-items: baseline; gap: 5px; }
        .bpm-text { font-size: 1rem; color: var(--text-muted); font-weight: normal; text-shadow: none; }
        
        .tempo-control-area { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .tempo-slider-container { display: flex; align-items: center; gap: 15px; width: 100%; }
        .tempo-limit { font-size: 0.9rem; color: var(--text-muted); font-weight: bold; }

        /* ===========================================
           9. 输入区及底部按钮
           =========================================== */
        .input-form { display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; align-items: center; gap: 15px; }
        .input-row label { width: 100px; font-size: 0.9rem; color: var(--text-muted); letter-spacing: 1px;}
        .glow-input {
            flex-grow: 1; padding: 10px 15px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff; font-size: 0.9rem; border-radius: 6px; outline: none; transition: 0.3s;
        }
        .glow-input:focus { border-bottom-color: var(--neon-cyan); background: rgba(0, 255, 255, 0.05); }

        .bottom-action { display: flex; justify-content: center; margin-top: 10px; }
        .synthesize-btn {
            padding: 15px 40px; background: transparent; border: 1px solid var(--neon-purple);
            border-radius: 30px; color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; animation: pulse-glow 2s infinite alternate;
        }
        .synthesize-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-purple); background: rgba(255, 0, 255, 0.1); }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px rgba(255, 0, 255, 0.3); } 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.8); border-color: #ffaaff; } }

    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="top-panel">
            <h1 class="hologram-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </div>

        <div class="synth-grid">
            
            <div id="oscillator-container" class="glass-panel module">
                <h2>I. OSCILLATOR</h2>
                <div class="control-row-clean">
                    <div class="waveform-group" id="osc-buttons">
                        <button class="wave-btn osc-sin active" data-wave="sine" title="Sine"></button>
                        <button class="wave-btn osc-tri" data-wave="triangle" title="Triangle"></button>
                        <button class="wave-btn osc-squ" data-wave="square" title="Square"></button>
                        <button class="wave-btn osc-saw" data-wave="sawtooth" title="Sawtooth"></button>
                    </div>
                    <div class="active-wave-display">
                        <canvas id="wave-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div id="filter-container" class="glass-panel module">
                <h2>II. FILTER</h2>
                <div class="control-row-clean">
                    <div class="slider-item">
                        <label class="large-label">Cutoff</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="70">
                    </div>
                    <div class="slider-item">
                        <label class="large-label">Resonance</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="40">
                    </div>
                </div>
            </div>

            <div id="envelope-container" class="glass-panel module">
                <h2>III. ENVELOPE</h2>
                <div class="fader-group">
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="40">
                        <label class="large-label">Attack</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="60">
                        <label class="large-label">Decay</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="50">
                        <label class="large-label">Sustain</label>
                    </div>
                    <div class="fader-item">
                        <input type="range" class="envelope-slider" min="0" max="100" value="80">
                        <label class="large-label">Release</label>
                    </div>
                </div>
            </div>

            <div id="lfo-container" class="glass-panel module">
                <h2>IV. LFO</h2>
                <div class="control-row-clean">
                    <div class="waveform-group">
                        <button class="wave-btn osc-sin active" title="Sine"></button>
                        <button class="wave-btn osc-tri" title="Triangle"></button>
                        <button class="wave-btn osc-squ" title="Square"></button>
                        <button class="wave-btn osc-saw" title="Sawtooth"></button>
                    </div>
                    <div class="slider-item">
                        <label class="large-label">Range</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="60">
                    </div>
                    <div class="slider-item">
                        <label class="large-label">Depth</label>
                        <input type="range" class="neon-slider" min="0" max="100" value="90">
                    </div>
                </div>
            </div>

            <div id="ritual-config-container" class="glass-panel module span-2">
                <h2>RITUAL CONFIGURATION</h2>
                <div class="config-flex">
                    <div class="bpm-display"><span id="bpm-value-display">120</span> <span class="bpm-text">BPM</span></div>
                    
                    <div class="tempo-control-area">
                        <label class="large-label">Tempo Slide</label>
                        <div class="tempo-slider-container">
                            <span class="tempo-limit">70 BPM</span>
                            <input type="range" class="neon-slider" id="tempo-slider" min="70" max="150" value="120">
                            <span class="tempo-limit">150 BPM</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ritual-input-container" class="glass-panel module span-2">
                <h2>SONIC RITUAL SPELL - INPUT</h2>
                <div class="input-form">
                    <div class="input-row">
                        <label>[GENRE]</label>
                        <input type="text" class="glow-input" placeholder="Hard acid techno..." value="Hard acid techno...">
                    </div>
                    <div class="input-row">
                        <label>[SOUNDS]</label>
                        <input type="text" class="glow-input" placeholder="Roland TB-303 squelch..." value="Roland TB-303 squelch, heavy resonance...">
                    </div>
                    <div class="input-row">
                        <label>[STRUCTURE]</label>
                        <input type="text" class="glow-input" placeholder="Ambient build to driving drop..." value="Ambient build to driving drop...">
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-action">
            <button class="synthesize-btn">SYNTHESIZE AUDIO RITUAL</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. BPM 滑块联动 ---
            const tempoSlider = document.getElementById('tempo-slider');
            const bpmDisplay = document.getElementById('bpm-value-display');
            
            tempoSlider.addEventListener('input', (e) => {
                bpmDisplay.textContent = e.target.value;
            });

            // --- 2. Canvas 波形绘制逻辑 ---
            const canvas = document.getElementById('wave-canvas');
            const ctx = canvas.getContext('2d');
            
            // 解决高分屏模糊问题
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 绘制数字波形的函数
            function drawWaveform(type) {
                const width = canvas.width / window.devicePixelRatio;
                const height = canvas.height / window.devicePixelRatio;
                
                ctx.clearRect(0, 0, width, height);
                
                // 设置发光线条样式
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ffff'; // 赛博青色
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                
                const centerY = height / 2;
                const amplitude = height * 0.35; // 波峰高度
                const frequency = 3; // 显示几个完整波长

                for (let x = 0; x < width; x++) {
                    // 将 x 坐标映射到相位 (0 到 2π * frequency)
                    const phase = (x / width) * Math.PI * 2 * frequency;
                    let y = centerY;

                    switch (type) {
                        case 'sine':
                            y = centerY - Math.sin(phase) * amplitude;
                            break;
                        case 'square':
                            // 简单的方波生成：sin > 0 为高，否则为低
                            y = centerY - (Math.sin(phase) > 0 ? 1 : -1) * amplitude;
                            break;
                        case 'triangle':
                            // 三角波公式
                            y = centerY - (Math.abs((phase / Math.PI) % 2 - 1) * 2 - 1) * amplitude;
                            break;
                        case 'sawtooth':
                            // 锯齿波公式
                            y = centerY - (((phase / Math.PI) % 2) - 1) * amplitude;
                            break;
                    }

                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }

            // 初始化显示正弦波
            drawWaveform('sine');


            // --- 3. Web Audio API 发声逻辑 ---
            let audioCtx;

            function playOscillator(type) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type; 
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 频率

                // 包络控制音量，防止爆音
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); // Attack
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.4); // Sustain
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5); // Release

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5); // 播放 0.5 秒
            }

            // --- 4. 绑定按钮点击事件 ---
            const oscButtons = document.querySelectorAll('#osc-buttons .wave-btn');
            oscButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 按钮高亮切换
                    oscButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const waveType = btn.getAttribute('data-wave');
                    
                    // 重绘画布波形
                    drawWaveform(waveType);
                    
                    // 播放声音
                    playOscillator(waveType);
                });
            });
        });
    </script>
</body>
</html>
