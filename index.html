<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="edit-hotzone"></div>
    <button id="editToggle" class="edit-toggle glass-btn">⚙️ ADVANCED RITUAL</button>
    
    <div class="app-container">
        
        <header class="top-panel glass-panel reveal">
            <h1 class="hologram-title">AI MUSIC GENERATOR</h1>
            <p class="hologram-subtitle">Powered by DiT Model | Sonic Ritual Spell Configuration</p>
        </header>

        <main class="synth-grid">
            
            <section class="module glass-panel reveal delay-1">
                <h2>I. OSCILLATOR</h2>
                <div class="waveform-group">
                    <button class="wave-btn osc-sin active">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 3 12 Q 8 3, 12 12 T 21 12" />
                        </svg>
                    </button>
                    <button class="wave-btn osc-tri">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 12 5 L 4 17 L 20 17 Z" />
                        </svg>
                    </button>
                    <button class="wave-btn osc-squ">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 4 16 V 8 H 12 V 16 H 20" />
                        </svg>
                    </button>
                    <button class="wave-btn osc-saw">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 3 16 L 9 6 L 15 16 L 21 6" />
                        </svg>
                    </button>
                </div>
